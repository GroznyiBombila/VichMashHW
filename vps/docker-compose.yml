# Перенаправитель Telegram Bot API для ESP32-CAM.
#
# Отдельный compose-проект `esp32proxy` со своим жизненным циклом: соседи
# по VPS (spectra, btc-prediction, automessage, tl_world_bot) не задеты
# ни при запуске, ни при остановке, ни при удалении.
#
# Через VPN, в отличие от spectra, НЕ ходим. Туннель там нужен из-за
# геоблокировки площадки, а Telegram с адреса хостера доступен напрямую.
# Лишний слой только добавил бы точку отказа.
#
# Подсеть задана явно. Автовыдача докера пошла бы в первую свободную и
# однажды столкнулась бы с чужой: 172.17-172.20 уже заняты соседями,
# 172.28 держит spectra. Берём 172.29 и фиксируем.
#
# Запуск:   docker compose -f deploy/docker-compose.yml up -d
# Логи:     docker logs -f esp32_tgproxy
# Остановка: docker compose -f deploy/docker-compose.yml down

name: esp32proxy

services:
  proxy:
    # Версия зафиксирована намеренно: `latest` однажды приедет с другим
    # поведением и молча сломает то, что работало.
    image: nginx:1.27-alpine
    container_name: esp32_tgproxy

    # Наружу торчит только этот порт и только он. Значение берётся из
    # переменной, чтобы не спорить с соседями за занятый номер.
    ports:
      - "${PROXY_PORT:-8099}:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    # Резолвер задан явно. Иначе DNS уходит в докеровский 127.0.0.11 и
    # дальше в системный резолвер хоста - лишнее звено, которое умеет
    # отваливаться само по себе.
    dns:
      - 1.1.1.1
      - 8.8.8.8

    # Проба спрашивает только сам nginx, наружу не ходит: иначе моргание
    # связи до Telegram перезапускало бы вполне живой контейнер.
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s

    networks:
      - esp32_net

    # nginx с одним клиентом столько не съест никогда, но лимит стоит,
    # чтобы контейнер не смог утянуть память у соседей по VPS.
    mem_limit: 64m
    restart: unless-stopped

networks:
  esp32_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
