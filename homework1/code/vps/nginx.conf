# =============================================================================
#  Перенаправитель Telegram Bot API для ESP32-CAM
# -----------------------------------------------------------------------------
#  Плата не может достучаться до api.telegram.org: сеть блокирует TCP до
#  этого адреса (проверено — DNS отвечает, соединение не встаёт). Обходим
#  не на плате, а на сервере: плата шлёт обычный HTTP сюда, nginx
#  переписывает запрос в HTTPS и отправляет в Telegram, ответ возвращает
#  как есть. Для платы это тот же Bot API, меняется только адрес.
#
#  Побочный плюс: шифрование съедало на плате около 40 КБ оперативной
#  памяти и заметное время на рукопожатие. Теперь этим занят сервер.
# =============================================================================

server {
    listen 80;
    server_name _;

    # Служебный адрес для healthcheck: докер дёргает его каждые 30 секунд.
    # Отдельным location, чтобы проба не ходила наружу в Telegram.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Пересылаем ТОЛЬКО запросы конкретного бота.
    #
    # Без этого ограничения любой, кто узнает адрес и порт, гонял бы через
    # твой сервер свои запросы к Telegram - то есть ты держал бы открытый
    # ретранслятор. Проверка идёт по номеру бота (это часть токена до
    # двоеточия, она не секретная), сам токен на сервере не хранится.
    # Подставь сюда номер своего бота - часть токена до двоеточия.
    location ~ ^/bot1234567890: {
        proxy_pass https://api.telegram.org;

        # SNI обязателен. Без него Telegram не понимает, какой сертификат
        # отдавать, и соединение рвётся прямо на рукопожатии.
        proxy_ssl_server_name on;
        proxy_ssl_name        api.telegram.org;
        proxy_set_header Host api.telegram.org;

        # ASCII-арт длинный, даём запас на тело запроса.
        client_max_body_size 1m;

        # Плата отвечает медленно, Telegram быстро. Таймауты с запасом,
        # чтобы отправка не срывалась на первом же тормозе.
        proxy_connect_timeout 10s;
        proxy_send_timeout    20s;
        proxy_read_timeout    20s;

        # Отдаём ответ плате сразу и целиком.
        proxy_buffering off;
    }

    # Всё остальное - отказ.
    location / {
        return 404;
    }
}
