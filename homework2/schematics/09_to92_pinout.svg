<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Arial, sans-serif">
<rect width="900" height="400" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" fill="#263238" text-anchor="start" font-weight="bold" >Цоколёвка 2N7000 (TO-92) и как ставить на плату</text>
<text x="24.0" y="58.0" font-size="13" fill="#546e7a" text-anchor="start" font-weight="normal" >Сверьте с даташитом своей партии. У BS170 и некоторых «аналогов» порядок другой: D-G-S.</text>
<rect x="120.0" y="100.0" width="100.0" height="110.0" rx="6" fill="#37474f" stroke="#101418" stroke-width="2"/>
<text x="170.0" y="150.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" >2N7000</text>
<text x="170.0" y="170.0" font-size="11" fill="#cfd8dc" text-anchor="middle" font-weight="normal" >плоская сторона</text>
<text x="170.0" y="186.0" font-size="11" fill="#cfd8dc" text-anchor="middle" font-weight="normal" >к вам</text>
<polyline points="140.0,210.0 140.0,290.0" fill="none" stroke="#9e9e9e" stroke-width="4" stroke-linejoin="round"/>
<text x="140.0" y="310.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >1</text>
<text x="140.0" y="330.0" font-size="16" fill="#263238" text-anchor="middle" font-weight="bold" >S</text>
<polyline points="170.0,210.0 170.0,290.0" fill="none" stroke="#9e9e9e" stroke-width="4" stroke-linejoin="round"/>
<text x="170.0" y="310.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >2</text>
<text x="170.0" y="330.0" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold" >G</text>
<polyline points="200.0,210.0 200.0,290.0" fill="none" stroke="#9e9e9e" stroke-width="4" stroke-linejoin="round"/>
<text x="200.0" y="310.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >3</text>
<text x="200.0" y="330.0" font-size="16" fill="#00897b" text-anchor="middle" font-weight="bold" >D</text>
<text x="170.0" y="360.0" font-size="12" fill="#546e7a" text-anchor="middle" font-weight="normal" >исток · затвор · сток</text>
<text x="170.0" y="90.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="bold" >Вид спереди, ножки вниз</text>
<text x="600.0" y="90.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="bold" >На плате (вид сверху, как на чертежах 05 и 07)</text>
