<circle cx="574" cy="229" r="6" fill="#ffd54f"/>
<text x="550.0" y="234.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" >G</text>
<circle cx="574" cy="281" r="6" fill="#ffd54f"/>
<text x="550.0" y="286.0" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" >S</text>
<text x="604.0" y="223.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold" >плоская</text>
<text x="604.0" y="239.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold" >сторона →</text>
<text x="600.0" y="372.0" font-size="12" fill="#c62828" text-anchor="middle" font-weight="bold" >Плоская сторона ВПРАВО (к столбцу 30): тогда D сверху, S снизу.</text>
<text x="600.0" y="390.0" font-size="12" fill="#546e7a" text-anchor="middle" font-weight="normal" >Развернёте влево — S и D поменяются местами, вентиль работать не будет.</text>
