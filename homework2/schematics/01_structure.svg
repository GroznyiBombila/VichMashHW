<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Segoe UI, Arial, sans-serif">
<rect width="1100" height="560" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="20" fill="#263238" text-anchor="start" font-weight="bold" >Структура: плата ввода-вывода и 4 платы разряда</text>
<text x="24.0" y="58.0" font-size="13" fill="#546e7a" text-anchor="start" font-weight="normal" >Каждая плата разряда — полный сумматор из 9 вентилей И-НЕ. Перенос идёт справа налево: C1, C2, C3 — через плату ввода-вывода.</text>
<rect x="40.0" y="90.0" width="1020.0" height="150.0" rx="10" fill="#f1f8e9" stroke="#558b2f" stroke-width="2"/>
<text x="60.0" y="114.0" font-size="15" fill="#263238" text-anchor="start" font-weight="bold" >Плата ввода-вывода</text>
<rect x="70.0" y="130.0" width="330.0" height="70.0" rx="6" fill="#1e63b5" stroke="#0d3c73" stroke-width="2"/>
<text x="235.0" y="158.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" >SW1 (DIP-8):  A3 A2 A1 A0 | B3 B2 B1 B0</text>
<text x="235.0" y="180.0" font-size="12" fill="#e3f2fd" text-anchor="middle" font-weight="normal" >положение ON = 1, OFF = 0</text>
<rect x="430.0" y="130.0" width="150.0" height="70.0" rx="6" fill="#1e63b5" stroke="#0d3c73" stroke-width="2"/>
<text x="505.0" y="158.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" >SW2 (DIP-1)</text>
<text x="505.0" y="180.0" font-size="12" fill="#e3f2fd" text-anchor="middle" font-weight="normal" >Cin, входной перенос</text>
<circle cx="640" cy="160" r="17" fill="#ef5350" stroke="#b71c1c" stroke-width="2"/>
<text x="640.0" y="198.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="bold" >Cout</text>
<circle cx="702" cy="160" r="17" fill="#ef5350" stroke="#b71c1c" stroke-width="2"/>
<text x="702.0" y="198.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="bold" >S3</text>
<circle cx="764" cy="160" r="17" fill="#ef5350" stroke="#b71c1c" stroke-width="2"/>
<text x="764.0" y="198.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="bold" >S2</text>
<circle cx="826" cy="160" r="17" fill="#ef5350" stroke="#b71c1c" stroke-width="2"/>
<text x="826.0" y="198.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="bold" >S1</text>
<circle cx="888" cy="160" r="17" fill="#ef5350" stroke="#b71c1c" stroke-width="2"/>
<text x="888.0" y="198.0" font-size="13" fill="#263238" text-anchor="middle" font-weight="bold" >S0</text>
<text x="764.0" y="222.0" font-size="12" fill="#546e7a" text-anchor="middle" font-weight="normal" >светодиоды: горит = 1; вес 16 8 4 2 1</text>
<text x="960.0" y="150.0" font-size="13" fill="#d32f2f" text-anchor="middle" font-weight="bold" >MB102, 5 В →</text>
<text x="960.0" y="168.0" font-size="12" fill="#546e7a" text-anchor="middle" font-weight="normal" >J1, C1 470 мкФ</text>
<rect x="860.0" y="330.0" width="180.0" height="130.0" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
<text x="950.0" y="356.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >Плата разряда 0</text>
<text x="950.0" y="378.0" font-size="11" fill="#546e7a" text-anchor="middle" font-weight="normal" >9 × И-НЕ = 18 × 2N7000 + 9 × 10 кОм</text>
<text x="950.0" y="404.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >A0 + B0 + Cin</text>
<text x="950.0" y="428.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >→ S0, C1</text>
<polyline points="950.0,240.0 950.0,330.0" fill="none" stroke="#78909c" stroke-width="6" stroke-linejoin="round"/>
<text x="960.0" y="290.0" font-size="11" fill="#455a64" text-anchor="start" font-weight="normal" >кабель X0 (7 проводов)</text>
<polyline points="858.0,440.0 802.0,440.0" fill="none" stroke="#ef6c00" stroke-width="3" stroke-linejoin="round"/>
<polygon points="802,440 814,434 814,446" fill="#ef6c00"/>
<text x="830.0" y="478.0" font-size="13" fill="#ef6c00" text-anchor="middle" font-weight="bold" >C1</text>
<rect x="620.0" y="330.0" width="180.0" height="130.0" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
<text x="710.0" y="356.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >Плата разряда 1</text>
<text x="710.0" y="378.0" font-size="11" fill="#546e7a" text-anchor="middle" font-weight="normal" >9 × И-НЕ = 18 × 2N7000 + 9 × 10 кОм</text>
<text x="710.0" y="404.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >A1 + B1 + C1</text>
<text x="710.0" y="428.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >→ S1, C2</text>
<polyline points="710.0,240.0 710.0,330.0" fill="none" stroke="#78909c" stroke-width="6" stroke-linejoin="round"/>
<text x="720.0" y="290.0" font-size="11" fill="#455a64" text-anchor="start" font-weight="normal" >кабель X1 (7 проводов)</text>
<polyline points="618.0,440.0 562.0,440.0" fill="none" stroke="#ef6c00" stroke-width="3" stroke-linejoin="round"/>
<polygon points="562,440 574,434 574,446" fill="#ef6c00"/>
<text x="590.0" y="478.0" font-size="13" fill="#ef6c00" text-anchor="middle" font-weight="bold" >C2</text>
<rect x="380.0" y="330.0" width="180.0" height="130.0" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
<text x="470.0" y="356.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >Плата разряда 2</text>
<text x="470.0" y="378.0" font-size="11" fill="#546e7a" text-anchor="middle" font-weight="normal" >9 × И-НЕ = 18 × 2N7000 + 9 × 10 кОм</text>
<text x="470.0" y="404.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >A2 + B2 + C2</text>
<text x="470.0" y="428.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >→ S2, C3</text>
<polyline points="470.0,240.0 470.0,330.0" fill="none" stroke="#78909c" stroke-width="6" stroke-linejoin="round"/>
<text x="480.0" y="290.0" font-size="11" fill="#455a64" text-anchor="start" font-weight="normal" >кабель X2 (7 проводов)</text>
<polyline points="378.0,440.0 322.0,440.0" fill="none" stroke="#ef6c00" stroke-width="3" stroke-linejoin="round"/>
<polygon points="322,440 334,434 334,446" fill="#ef6c00"/>
<text x="350.0" y="478.0" font-size="13" fill="#ef6c00" text-anchor="middle" font-weight="bold" >C3</text>
<rect x="140.0" y="330.0" width="180.0" height="130.0" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
<text x="230.0" y="356.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >Плата разряда 3</text>
<text x="230.0" y="378.0" font-size="11" fill="#546e7a" text-anchor="middle" font-weight="normal" >9 × И-НЕ = 18 × 2N7000 + 9 × 10 кОм</text>
<text x="230.0" y="404.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >A3 + B3 + C3</text>
<text x="230.0" y="428.0" font-size="14" fill="#263238" text-anchor="middle" font-weight="bold" >→ S3, Cout</text>
<polyline points="230.0,240.0 230.0,330.0" fill="none" stroke="#78909c" stroke-width="6" stroke-linejoin="round"/>
<text x="240.0" y="290.0" font-size="11" fill="#455a64" text-anchor="start" font-weight="normal" >кабель X3 (7 проводов)</text>
<text x="550.0" y="500.0" font-size="12" fill="#546e7a" text-anchor="middle" font-weight="normal" >Физически перенос C1…C3 идёт по проводу кабеля (контакт 7 → контакт 5 соседнего) через плату ввода-вывода.</text>
<text x="550.0" y="520.0" font-size="12" fill="#546e7a" text-anchor="middle" font-weight="normal" >Разъём J1 платы разряда: 1 +5V, 2 GND, 3 A, 4 B, 5 Cin, 6 S, 7 Cout.</text>
</svg>